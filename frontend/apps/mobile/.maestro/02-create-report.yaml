# Baches RD Mobile — E2E: Crear reporte por nombre de calle
# Requiere: app instalada, backend corriendo en 10.0.2.2:8080 (Android) o localhost:8080.
# Ejecutar: maestro test .maestro/02-create-report.yaml

appId: com.angelrmatoz.mobile
---
- launchApp:
    clearState: true

# Dashboard (mapa público) sin sesión; navegar a login
- extendedWaitUntil:
    visible: "Baches RD"
    timeout: 30000
- assertVisible: "Iniciar sesión"
- tapOn: "Iniciar sesión"

# Login
- assertVisible: "Correo electrónico"
- tapOn:
    id: "login-email"
- inputText: "admin@bachesrd.com"
- tapOn:
    id: "login-password"
- inputText: "admin123"
- tapOn: "Entrar al mapa"

# Abrir modal de nuevo reporte
- assertVisible: "Reportar un bache"
- tapOn: "Reportar un bache"
- assertVisible: "Reportar nuevo bache"

# Modo street (por defecto) + buscar calle
- assertVisible: "1. Por nombre de calle"
- tapOn: "Ej: Av. 27 de Febrero esq. Lope de Vega"
- inputText: "Av. 27 de Febrero"

# Esperar sugerencia en vivo de Nominatim (debounce 450ms + red)
- extendedWaitUntil:
    visible: ".*27 de Febrero.*"
    timeout: 30000

# Seleccionar primera sugerencia del mapa
- tapOn:
    text: ".*27 de Febrero.*"
    index: 0

# Severidad del daño
- assertVisible: "Severidad del daño"
- tapOn: "MEDIA"

# Publicar
- tapOn: "Publicar reporte"

# Si ya existe un reporte activo a <30m, aparece el diálogo anti-duplicado (idempotente)
- runFlow:
    when:
      visible: "Reporte duplicado detectado"
    commands:
      - assertVisible: "Reporte duplicado detectado"
      - tapOn: "Cerrar"

# El modal se cierra y vuelve al dashboard
- assertNotVisible: "Reportar nuevo bache"
- extendedWaitUntil:
    visible: "Baches RD"
    timeout: 30000