name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests sin DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar y correr unit tests (excluye @SpringBootTest con DB)
        run: ./mvnw -B test -Dtest='!BackendApplicationTests,!SecurityIntegrationTest,!AuthControllerTest'

  frontend:
    name: Frontend (tests unitarios e integración)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Tests vitest (unitarios + integración)
        run: pnpm --filter web test

  frontend-e2e:
    name: Frontend (e2e Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Instalar browsers Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - name: Build + servidor preview + tests e2e (chromium + webkit)
        env:
          CI: ''
        run: |
          pnpm --filter web build
          pnpm --filter web exec vite preview --port 5173 --strictPort &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID" EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:5173 >/dev/null || { echo "El servidor preview no arrancó a tiempo"; exit 1; }
          pnpm --filter web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
